name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'   # или '1.23' / 'stable' — у тебя в go.mod стоит 1.26.5 (похоже на опечатку)

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/go-video-streaming-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/go-video-streaming-linux-arm64 .

          # macOS
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/go-video-streaming-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/go-video-streaming-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/go-video-streaming-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/go-video-streaming-windows-arm64.exe .

          # Checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}