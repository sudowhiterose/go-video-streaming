name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Code formatting issues found. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Test Build
        run: GOOS=linux GOARCH=amd64 go build -v -o /dev/null main.go
